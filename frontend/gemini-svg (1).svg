<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Clean White -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Main Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>

    <!-- Rose Gold / Pink Gradient -->
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF85A1"/>
      <stop offset="50%" stop-color="#FBB1BD"/>
      <stop offset="100%" stop-color="#F9BEC7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="100%" stop-color="#799F0C"/>
    </linearGradient>

    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#FDA085"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2D3748" flood-opacity="0.10"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF85A1" flood-opacity="0.25"/>
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#11998e" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Pure White Canvas Background -->
  <rect width="800" height="800" fill="#FFFFFF"/>

  <!-- Decorative Islamic Geometry Elements in Background -->
  <g opacity="0.2">
    <circle cx="400" cy="380" r="320" fill="none" stroke="#FF85A1" stroke-width="1.5" stroke-dasharray="6,6"/>
    <circle cx="400" cy="380" r="340" fill="none" stroke="#11998e" stroke-width="1"/>
    
    <!-- Star Motif Pattern Behind -->
    <g transform="translate(400, 380) scale(1.4)" stroke="#FBB1BD" stroke-width="1" fill="none">
      <polygon points="0,-180 127,-127 180,0 127,127 0,180 -127,127 -180,0 -127,-127"/>
      <polygon points="0,-180 127,127 -180,0 127,-127 0,180 -127,-127 180,0 -127,127" opacity="0.5"/>
    </g>
  </g>

  <!-- MAIN LOGO CONTAINER -->
  <g id="main-logo" filter="url(#shadow)">

    <!-- Outer Decorative Floral / Crescent Frame -->
    <path d="M 400,120 
             A 260,260 0 1,0 660,380 
             A 240,240 0 1,1 400,140 Z" 
          fill="url(#roseGrad)" opacity="0.85" filter="url(#glow)"/>

    <!-- PIN LOKASI Utama (Main GPS Location Pin) -->
    <path d="M 400,150 
             C 275,150 175,250 175,375 
             C 175,520 360,670 390,693 
             C 396,698 404,698 410,693 
             C 440,670 625,520 625,375 
             C 625,250 525,150 400,150 Z" 
          fill="url(#emeraldGrad)"/>

    <!-- Inner White Border in Pin -->
    <path d="M 400,165 
             C 285,165 192,258 192,373 
             C 192,505 360,642 400,673 
             C 440,642 608,505 608,373 
             C 608,258 515,165 400,165 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.4"/>

    <!-- Inner Circle Background -->
    <circle cx="400" cy="370" r="170" fill="#FFFFFF"/>
    <circle cx="400" cy="370" r="158" fill="#FFF5F7"/>

    <!-- CAMERA APERTURE / LENS FRAME -->
    <circle cx="400" cy="370" r="145" fill="none" stroke="url(#roseGrad)" stroke-width="8"/>
    
    <!-- Camera Shutter Blades -->
    <g opacity="0.15" stroke="#FF85A1" stroke-width="3">
      <line x1="400" y1="225" x2="480" y2="280"/>
      <line x1="545" y1="370" x2="470" y2="450"/>
      <line x1="480" y1="515" x2="380" y2="480"/>
      <line x1="400" y1="515" x2="320" y2="460"/>
      <line x1="255" y1="370" x2="330" y2="290"/>
      <line x1="320" y1="225" x2="420" y2="260"/>
    </g>

    <!-- SILUET MUSLIMAH -->
    <g id="muslimah-silhouette">
      <!-- Head / Hijab Outer Shape -->
      <path d="M 400,265 
               C 360,265 330,295 330,345 
               C 330,380 345,420 370,445 
               C 385,460 388,480 375,495 
               C 365,507 350,515 330,520
               L 470,520
               C 450,515 435,507 425,495
               C 412,480 415,460 430,445
               C 455,420 470,380 470,345
               C 470,295 440,265 400,265 Z" 
            fill="url(#roseGrad)"/>

      <!-- Inner Face Oval Contour -->
      <path d="M 400,285 
               C 375,285 360,310 360,340 
               C 360,375 378,400 400,412 
               C 422,400 440,375 440,340 
               C 440,310 425,285 400,285 Z" 
            fill="#FFFFFF"/>

      <!-- Soft Face Profile Line -->
      <path d="M 395,315 
               C 405,325 408,338 402,350 
               C 398,358 392,362 395,372 
               C 397,378 405,382 412,382" 
            fill="none" stroke="#FBB1BD" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Hijab Draping Accent -->
      <path d="M 360,385 C 385,415 415,415 440,385" fill="none" stroke="#FF85A1" stroke-width="3" opacity="0.5"/>
    </g>

    <!-- INTEGRATED CAMERA BADGE -->
    <g transform="translate(485, 435)" filter="url(#badgeShadow)">
      <circle cx="0" cy="0" r="38" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="32" fill="url(#emeraldGrad)"/>
      
      <!-- Camera Icon -->
      <path d="M -14,-6 
               L -9,-6 L -6,-10 L 6,-10 L 9,-6 L 14,-6 
               C 17.3,-6 20,-3.3 20,0 
               L 20,12 
               C 20,15.3 17.3,18 14,18 
               L -14,18 
               C -17.3,18 -20,15.3 -20,12 
               L -20,0 
               C -20,-3.3 -17.3,-6 -14,-6 Z" 
            fill="#FFFFFF"/>
      <circle cx="0" cy="6" r="7" fill="none" stroke="#11998e" stroke-width="3"/>
      <circle cx="0" cy="6" r="3" fill="#FFFFFF"/>
      <circle cx="11" cy="-1" r="1.5" fill="#FFFFFF"/>
    </g>

    <!-- CHECKMARK BARAKAH / ABSENSI -->
    <g transform="translate(315, 435)" filter="url(#badgeShadow)">
      <circle cx="0" cy="0" r="34" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="28" fill="url(#goldMetallic)"/>
      <path d="M -10,1 L -3,8 L 11,-6" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- SPARKLES -->
    <path d="M 520,220 Q 520,235 535,235 Q 520,235 520,250 Q 520,235 505,235 Q 520,235 520,220 Z" fill="url(#goldMetallic)"/>
    <path d="M 270,260 Q 270,270 280,270 Q 270,270 270,280 Q 270,270 260,270 Q 270,270 270,260 Z" fill="#FF85A1"/>
  </g>

  <!-- TEXT SECTION -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="400" y="745" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
          font-size="40" 
          font-weight="bold" 
          letter-spacing="2"
          fill="#1A365D">
      PRESENSI MUSLIMAH
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="400" y="775" 
          font-family="'Poppins', 'Montserrat', 'Helvetica', sans-serif" 
          font-size="16" 
          font-weight="500" 
          letter-spacing="4" 
          fill="#11998e">
      ABSENSI PENGAJIAN GEOLOCATION &amp; FOTO
    </text>
  </g>
</svg>
